# pyproject.toml — Augur (CAESAR) 패키징 + 테스트 설정
#
# 왜 생겼나 (2026-09-15): 이게 없어서 저장소는 설치 불가능한 스크립트 더미였고,
# 97개 파일이 `sys.path.insert(0, ROOT)`로 임포트를 뚫고 있었다. 저널 리뷰어가
# 클론해서 `pip install -e .` 한 줄로 core/gui/oculus를 임포트할 수 있어야 한다.
#
# 기존 sys.path 해킹은 이번에 일괄 제거하지 않았다 — 설치돼 있으면 무해한
# no-op이고, 97파일 동시 수정은 진행 중인 GUI 분해 작업과 충돌한다. 새 코드는
# 해킹 없이 그냥 `from core...`를 쓸 것.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "augur-caesar"
version = "0.2.0"                      # CITATION.cff와 같은 값을 유지할 것
description = "Augur (CAESAR): BBCEAS 미량기체 분석 — raw → alpha → DOAS 피팅 → 농도"
readme = "README.md"
requires-python = ">=3.11"     # README 선언 기준. 실제로 돌려본 건 3.13(로컬)·3.14(CI)뿐
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HwanKyungLee" }]
# 의존성 단일 출처 = requirements.txt (핀 버전). 여기서 목록을 복제하지 않는다.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/HwanKyungLee/CAESAR"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# 임포트 가능한 패키지만. tools/·diagnostics/·calibration/은 스크립트 폴더라
# 패키지로 설치하지 않는다(저장소 루트에서 실행하는 용도).
packages = [
    "core",
    "gui", "gui.ui_plot_maker",
    "oculus", "oculus.monitors", "oculus.dashboard",
]

[tool.setuptools.package-data]
oculus = ["profiles/*.json", "profiles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 저장소 곳곳의 `test_*.py`는 pytest가 직접 수집하면 안 된다(대부분 __main__
# 가드 안에서 돌고, gui/test_fit_dialog.py는 아예 테스트가 아니다).
# tests/test_script_suite.py가 서브프로세스로 하나씩 돌린다.
addopts = "-q"
