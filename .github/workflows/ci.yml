# Augur CI — 대부분 데이터 없이 돌 수 있는 검증 + 커밋된 소형 실데이터
# fixture(diagnostics/alpha_pass2_parallel/fixtures/, raw 150행×2파일) 기반
# Pass2 병렬 회귀 1건 (개선작업지시_2026-07 §C-2)
#
# 1인 개발 bus-factor 완화: 커밋마다 아래를 자동 확인해 '고치다 조용히 깨지는'
# 회귀(bit-rot·물리식 회귀·병렬/순차 divergence)를 빨간불로 띄운다. 캠페인
# 규모 전체 검증(raw 파싱 대조·웨이브칼·R·핏 출력)은 로컬에서
# validate_pipeline(전체 모드)로.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen   # GUI 모듈 headless 임포트/렌더
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # PyQt6 offscreen 구동에 필요한 시스템 라이브러리 (Qt 플랫폼 플러그인)
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # 패키지로 설치까지 되는지 확인 — pyproject.toml이 깨지면 여기서 빨간불.
      # (리뷰어/외부 사용자는 `pip install -e .` 한 줄로 core/gui/oculus를 임포트한다)
      - name: Install package (editable)
        run: |
          pip install -e . --no-deps
          pip install pytest

      # 전 모듈 임포트 스모크 — core/gui/tools/diagnostics/calibration 의 모든 .py
      - name: Import smoke test
        run: python tools/ci_import_smoke.py

      # 데이터 비의존 파이프라인 검증 (Rayleigh King factor 골든값 등)
      - name: validate_pipeline --no-data
        run: python tools/validate_pipeline.py --no-data

      # 저장소의 `test_*.py` **전부** + core 자체검증 모듈 (44개, ~30초).
      # 여기에 스크립트를 한 줄씩 등록하던 방식을 2026-09-15에 접었다. 그 방식의
      # 실패 모드는 "등록을 잊는 것"이고, 실제로 42개 중 10개만 등록돼 있었으며
      # 등록 안 된 것 중 2개가 깨진 채로 방치돼 있었다(n_air 단일출처 통일 때
      # 동결 산출물과 어긋난 것 1건, Windows CRLF로 sha256이 깨진 것 1건).
      # 이제 tests/test_script_suite.py가 자동 탐색한다 — 새 테스트를 추가할 때
      # 이 파일은 안 건드려도 된다. 각 테스트가 무엇을 지키는지는 그 테스트의
      # docstring에, 제외 2건과 사유는 test_script_suite.py에 있다.
      - name: Test suite (pytest)
        run: pytest

      # Plot Maker pg/mpl 패리티 검증 (offscreen, 합성 데이터 24항목)
      - name: validate_plotmaker
        run: python tools/validate_plotmaker.py
