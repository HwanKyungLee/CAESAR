# Augur CI — 대부분 데이터 없이 돌 수 있는 검증 + 커밋된 소형 실데이터
# fixture(diagnostics/alpha_pass2_parallel/fixtures/, raw 150행×2파일) 기반
# Pass2 병렬 회귀 1건 (개선작업지시_2026-07 §C-2)
#
# 1인 개발 bus-factor 완화: 커밋마다 아래를 자동 확인해 '고치다 조용히 깨지는'
# 회귀(bit-rot·물리식 회귀·병렬/순차 divergence)를 빨간불로 띄운다. 캠페인
# 규모 전체 검증(raw 파싱 대조·웨이브칼·R·핏 출력)은 로컬에서
# validate_pipeline(전체 모드)로.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen   # GUI 모듈 headless 임포트/렌더
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # PyQt6 offscreen 구동에 필요한 시스템 라이브러리 (Qt 플랫폼 플러그인)
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # 전 모듈 임포트 스모크 — core/gui/tools/diagnostics/calibration 의 모든 .py
      - name: Import smoke test
        run: python tools/ci_import_smoke.py

      # 데이터 비의존 파이프라인 검증 (Rayleigh King factor 골든값 등)
      - name: validate_pipeline --no-data
        run: python tools/validate_pipeline.py --no-data

      # Oculus 인스트루먼트 프로파일 로더 단위테스트 (합성 raw 행)
      - name: Oculus profile unit tests
        run: python oculus/test_profile.py

      # 합성 데이터 단위테스트 (계단 가드 · etalon 공선성 진단)
      - name: Step guard unit tests
        run: python tools/test_step_guard.py

      - name: Etalon collinearity unit tests
        run: python tools/test_etalon_collinearity.py

      # VarPro 선형/자코비안 불변식 (합성 레퍼런스, 데이터 불필요)
      # - make_interp_spline == interp1d 비트동일: scipy 업그레이드로 깨지면
      #   engine의 도함수가 핏의 보간기와 달라져 자코비안이 조용히 틀린다
      # - 해석적(Golub-Pereyra) 자코비안 == 유한차분
      - name: VarPro jacobian unit tests
        run: python tools/test_varpro_jacobian.py

      # Pass2(alpha) 병렬 vs 순차 byte-exact 회귀 — 커밋된 작은 실데이터 fixture 사용
      - name: Pass2 parallel-vs-sequential byte-exact test
        run: python tools/test_pass2_parallel.py

      # 메인창(CAESARAnalyzer) offscreen 생성 + 분해 앵커.
      # app_window.py를 믹스인으로 쪼개는 동안 메서드/위젯 유실과 믹스인 이름
      # 충돌을 잡는다 — 둘 다 임포트 스모크는 통과하고 버튼 누를 때만 터진다.
      - name: app_window smoke (offscreen)
        run: python tools/test_app_window_smoke.py

      # Plot Maker pg/mpl 패리티 검증 (offscreen, 합성 데이터 24항목)
      - name: validate_plotmaker
        run: python tools/validate_plotmaker.py

      # 논문 통계 모듈 자체검증 (합성 데이터, 데이터 불필요).
      # 두 모듈은 저장소 안에 호출자가 거의 없어(외부 대조 스크립트 1개뿐) 조용히
      # 썩기 쉽다 — asserts가 OLS 감쇠 vs Deming 회복, 미정량 항 개수를 고정한다.
      - name: Agreement / error-budget self-checks
        run: |
          python core/agreement.py
          python core/error_budget.py
